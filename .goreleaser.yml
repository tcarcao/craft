version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: craft
    main: ./cmd/craft
    binary: craft-cli
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w

archives:
  - id: craft
    name_template: "craft_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"

brews:
  - name: craft-cli
    ids: [craft]
    repository:
      owner: tcarcao
      name: homebrew-craft
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/tcarcao/craft"
    description: "DDD modeling CLI — parse, lint, inspect, and generate diagrams from .craft files"
    license: "MIT"
    install: |
      bin.install "craft-cli"
    test: |
      system "#{bin}/craft-cli", "--help"
